<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foxglove Catalogue</title><style>body{background:#14231d;color:#eee8d8;font:15px system-ui;margin:0}main{max-width:1050px;margin:auto;padding:18px}h1{color:#edc878}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.card{background:#26392e;border:1px solid #647e6b;border-radius:12px;padding:14px}.muted{color:#b6c8ba;font-size:13px}button,input,select{padding:10px;border:1px solid #7c9c80;border-radius:7px;background:#172b20;color:white}button{background:#b58a49;color:#171e18;font-weight:bold}a{color:#edc878}.model{height:110px;background:radial-gradient(#47604b,#1a2920);display:grid;place-items:center;perspective:450px;overflow:hidden}.cube{width:52px;height:72px;position:relative;transform-style:preserve-3d;animation:turn 9s linear infinite}.cube div{position:absolute;inset:0;background:#a78d63;border:2px solid #e2c88c}.cube .front{transform:translateZ(24px);background:linear-gradient(#d7c9a3 20%,#6f8c76 20% 75%,#d7c9a3 75%)}.cube .back{transform:rotateY(180deg) translateZ(24px)}.cube .left{transform:rotateY(-90deg) translateZ(24px)}.cube .right{transform:rotateY(90deg) translateZ(24px)}@keyframes turn{to{transform:rotateY(360deg)}}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.bar input{flex:1;min-width:140px}</style><main><a href="./">← Shelter</a><h1>FOXGLOVE / PRODUCT CATALOGUE</h1><p>Real branded items, nutrition where verified, planning prices and purchasing status. Models are rotating geometric placeholders, not yet product-accurate 3D reconstructions.</p><div id="stats"></div><div class="bar"><input id="search" placeholder="Search products"><select id="category"><option>All categories</option></select><button id="export">Export catalogue inventory</button></div><div class="grid" id="grid"></div></main><script>const P=[["Mountain House","Ground Beef #10 Can","Food",94.99,4840,440,"22 servings, 220 calories and 20g protein each","https://mountainhouse.com/products/ground-beef-10-can"],["Mountain House","Diced Chicken #10 Can","Food",77.99,null,350,"14 servings, 25g protein each; calories unverified","https://mountainhouse.com/products/diced-chicken-10-can"],["Mountain House","Diced Beef #10 Can","Food",109.99,2100,null,"15 servings, 140 calories each","https://mountainhouse.com/collections/10-cans/products/diced-beef-10-can"],["Augason Farms","Dried Whole Egg Powder, 85 servings","Food",69.98,null,null,"10-year advertised shelf life; calories to verify","https://www.walmart.com/ip/21777161"],["Keystone","Ground Beef 28 oz Can","Food",12.99,null,null,"Shelf-stable cooked protein; nutrition to verify","https://www.walmart.com/ip/23636965"],["Midland","ER310 Weather Radio","Communications",89.99,0,0,"AM/FM, NOAA, crank charging","https://midlandusa.com/products/er310-portable-emergency-crank-weather-radio"],["Camp Chef","Everest 2X Stove","Cooking",190,0,0,"Outdoor backup cooking; estimated price",""],["Norwesco","100-gallon Potable Tank","Water",350,0,0,"Tank model and exact dimensions to verify; estimated price",""],["Sawyer","Squeeze Filter","Water",45,0,0,"Backup water filter; estimated price",""],["Fenix","CL30R Lantern","Power",110,0,0,"Rechargeable lighting; estimated price",""],["Anker","SOLIX F3800","Power",2700,0,0,"3.84 kWh power station; estimated price",""],["Adventure Medical Kits","Mountain Series Explorer","Medical",75,0,0,"First aid kit; estimated price",""],["3M","Aura 9205+ N95 20-pack","Medical",28,0,0,"Respiratory protection; estimated price",""],["Thetford","Porta Potti 365","Sanitation",155,0,0,"Emergency toilet; estimated price",""],["BIC","Classic Lighters 5-pack","Tools",9,0,0,"Backup fire starters; estimated price",""],["UCO","Stormproof Matches","Tools",12,0,0,"Water-resistant ignition; estimated price",""],["Bicycle","Standard Playing Cards","Entertainment",5,0,0,"No-power recreation; estimated price",""],["Hasbro","Scrabble","Entertainment",22,0,0,"No-power recreation; estimated price",""]];let stock={};try{stock=JSON.parse(localStorage.getItem('foxgloveCatalog')||'{}')}catch{}const $=id=>document.getElementById(id);function save(){localStorage.setItem('foxgloveCatalog',JSON.stringify(stock));render()}function set(i,k,v){stock[i]??={qty:1,status:'Planned'};stock[i][k]=v;save()}function render(){const cat=$('category').value,q=$('search').value.toLowerCase();let total=0,cals=0,ordered=0;Object.entries(stock).forEach(([i,s])=>{const p=P[i];if(!p)return;if(s.status==='Received'){total+=p[3]*s.qty;cals+=(p[4]||0)*s.qty}if(s.status==='Ordered')ordered+=p[3]*s.qty});$('stats').textContent='Received value: $'+total.toFixed(2)+' | Ordered value: $'+ordered.toFixed(2)+' | Verified received calories: '+cals.toLocaleString()+' (incomplete until all nutrition is verified)';$('grid').innerHTML=P.map((p,i)=>({p,i})).filter(({p})=>(cat==='All categories'||p[2]===cat)&&(p[0]+' '+p[1]).toLowerCase().includes(q)).map(({p,i})=>{let s=stock[i]||{qty:1,status:'Planned'};return '<div class="card"><div class="model"><div class="cube"><div class="front"></div><div class="back"></div><div class="left"></div><div class="right"></div></div></div><p class="muted">'+p[0]+' · '+p[2]+'</p><h3>'+p[1]+'</h3><h2>$'+p[3].toFixed(2)+'</h2><p>'+p[6]+'</p><p class="muted">'+(p[4]===null?'Calories not verified':p[4].toLocaleString()+' kcal/package')+(p[5]?' · '+p[5]+'g protein/package':'')+'</p>'+(p[7]?'<p><a target="_blank" rel="noopener" href="'+p[7]+'">Product source ↗</a></p>':'<p class="muted">Vendor/SKU to confirm</p>')+'<label>Quantity <input style="width:55px" type="number" min="0" value="'+s.qty+'" onchange="set('+i+',\'qty\',Math.max(0,+this.value||0))"></label> <select onchange="set('+i+',\'status\',this.value)">'+['Planned','Ordered','Received'].map(v=>'<option '+(v===s.status?'selected':'')+'>'+v+'</option>').join('')+'</select></div>'}).join('')};[...new Set(P.map(p=>p[2]))].forEach(c=>{let o=document.createElement('option');o.textContent=c;$('category').append(o)});$('search').oninput=render;$('category').onchange=render;$('export').onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({products:P,inventory:stock},null,2)],{type:'application/json'}));a.href=u;a.download='foxglove-catalogue.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};render();</script></html>
